{% extends "base.html" %}
{% block title %}Login — SecureNeuroGrade{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-theme-toggle">
        <button id="theme-toggle" class="theme-toggle-btn" type="button" title="Toggle Light / Dark Mode" aria-label="Toggle theme">
            <span class="theme-toggle-icon">
                <svg class="ui-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                </svg>
            </span>
        </button>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <a href="{{ url_for('easter_egg') }}" title="Meet the Developers" style="text-decoration: none; color: inherit;">
                <span class="auth-icon">
                    <svg class="auth-icon-svg" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 0 5.61 3 3 0 1 0 5.142 3.01A3 3 0 1 0 12 17"/>
                        <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1 0 5.61 3 3 0 1 1-5.142 3.01A3 3 0 1 1 12 17"/>
                        <path d="M12 5v14"/>
                        <path d="M12 9a3 3 0 0 0-3 3"/>
                        <path d="M12 13a3 3 0 0 1 3 3"/>
                    </svg>
                </span>
            </a>
            <a href="/" style="text-decoration: none;" title="Dashboard">
                <h1 class="brand-text-login">SecureNeuroGrade</h1>
            </a>
            <p class="auth-subtitle">Secure AI-Assisted Brain Tumor Detection</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-input"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" id="login-submit" class="btn btn-primary btn-block">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            <p class="auth-note">
                Authorized personnel only. All access is logged and audited.
            </p>
        </div>
    </div>
</div>
{% endblock %}
